server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # assets com hash — cache longo
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # fecha cache para html e sw
  location = /index.html { expires -1; add_header Cache-Control "no-cache"; }
  location = /sw.js { expires -1; add_header Cache-Control "no-cache"; }
  location = /manifest.webmanifest { expires 1h; }

  # healthcheck
  location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }

  # segurança
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # CSP: ajuste se adicionar scripts externos
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; script-src 'self' 'unsafe-inline'; connect-src 'self';" always;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;
  gzip_min_length 1024;
}
